<svg width="1060" height="207" viewBox="0 0 1060 207"
     xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     role="img" aria-label="ANative Lab">
  <title>ANative Lab</title>
  <defs>
    <linearGradient id="archGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00775b"/>
      <stop offset="0.18" stop-color="#00bf7c"/>
      <stop offset="0.37" stop-color="#59f2b3"/>
      <stop offset="0.53" stop-color="#a8f8d1"/>
      <stop offset="0.69" stop-color="#12cd87"/>
      <stop offset="0.86" stop-color="#00835e"/>
      <stop offset="1" stop-color="#003f34"/>
    </linearGradient>
    <linearGradient id="returnGradient" x1="0" y1="0.25" x2="1" y2="0.8">
      <stop offset="0" stop-color="#69f4bc" stop-opacity="0.94"/>
      <stop offset="0.23" stop-color="#18d88f" stop-opacity="0.95"/>
      <stop offset="0.49" stop-color="#00a66d" stop-opacity="0.88"/>
      <stop offset="0.69" stop-color="#b2f7d7" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#00b977" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="leftFoldGradient" gradientUnits="userSpaceOnUse"
                    x1="275" y1="525" x2="630" y2="735">
      <stop offset="0" stop-color="#001e1b"/>
      <stop offset="0.26" stop-color="#003a31"/>
      <stop offset="0.58" stop-color="#079965"/>
      <stop offset="0.82" stop-color="#00483a"/>
      <stop offset="1" stop-color="#001d1a"/>
    </linearGradient>
    <linearGradient id="rightFoldGradient" gradientUnits="userSpaceOnUse"
                    x1="720" y1="548" x2="1010" y2="730">
      <stop offset="0" stop-color="#00483a"/>
      <stop offset="0.3" stop-color="#087d57"/>
      <stop offset="0.58" stop-color="#00c97e"/>
      <stop offset="0.78" stop-color="#075f49"/>
      <stop offset="1" stop-color="#001e1b"/>
    </linearGradient>
    <linearGradient id="wordGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#172d3d"/>
      <stop offset="1" stop-color="#0b1d2b"/>
    </linearGradient>
    <radialGradient id="leftHighlight" cx="48%" cy="24%" r="76%">
      <stop offset="0" stop-color="#7cface" stop-opacity="0.92"/>
      <stop offset="0.5" stop-color="#1ee49a" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#00a970" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/>
      <feOffset dy="7" result="offset"/>
      <feColorMatrix in="offset" type="matrix" values="0 0 0 0 0.00  0 0 0 0 0.09  0 0 0 0 0.07  0 0 0 .20 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="mainArch" d="M252 718
      C326 586 355 420 446 420
      C536 420 571 588 636 704
      C651 732 672 748 690 718
      C757 603 790 420 810 420
      C902 420 934 585 1008 718"/>
    <path id="lowerReturn" d="M252 718
      C319 674 366 639 424 657
      C492 678 520 741 588 742
      C652 743 690 690 738 668
      C797 642 834 659 875 704
      C913 745 952 748 1008 718"/>
  </defs>

  <!-- Ribbon mark: same paths as ANative_Lab_vector.svg, scaled into the banner. -->
  <g transform="translate(-56 -120) scale(0.38)" filter="url(#softShadow)">
    <use xlink:href="#lowerReturn" fill="none" stroke="url(#returnGradient)"
         stroke-width="103" stroke-linecap="round" stroke-linejoin="round"/>
    <use xlink:href="#mainArch" fill="none" stroke="url(#archGradient)"
         stroke-width="104" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M349 535 C379 455 405 419 447 420 C520 421 557 577 612 680"
          fill="none" stroke="url(#leftHighlight)" stroke-width="74"
          stroke-linecap="round" opacity="0.56"/>
    <path d="M720 660 C760 558 779 426 815 420 C881 410 927 569 972 657"
          fill="none" stroke="url(#leftHighlight)" stroke-width="70"
          stroke-linecap="round" opacity="0.48"/>
    <path d="M252 718
      C310 614 334 523 371 511
      C412 498 438 535 466 594
      C516 697 553 746 617 746
      C651 746 674 728 690 700"
      fill="none" stroke="url(#leftFoldGradient)" stroke-width="105"
      stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M690 700
      C733 626 758 529 808 512
      C856 496 888 539 916 600
      C963 704 983 727 1008 718"
      fill="none" stroke="url(#rightFoldGradient)" stroke-width="105"
      stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark stays live text (editable); textLength pins the layout across fonts. -->
  <g fill="url(#wordGradient)"
     font-family="Avenir Next, Avenir, Inter, SF Pro Display, -apple-system, Helvetica Neue, Arial, sans-serif"
     font-size="124">
    <text x="372" y="148" font-weight="700" textLength="448" lengthAdjust="spacingAndGlyphs">ANative</text>
    <text x="846" y="148" font-weight="300" textLength="188" lengthAdjust="spacingAndGlyphs">Lab</text>
  </g>
</svg>
